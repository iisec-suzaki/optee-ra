# Built-in, not a module: the driver has to register the TPM during kernel
# init so that IMA finds one when it looks (IMA gives up permanently if no
# TPM is present at that point). This only works together with an OP-TEE
# whose secure storage does not depend on tee-supplicant.
CONFIG_TCG_FTPM_TEE=y

# IMA, so that the measurement log is anchored in the fTPM. This is what the
# early start is for; CONFIG_IMA_WRITE_POLICY lets a policy be loaded at
# runtime while the measurement scope is still being decided.
CONFIG_SECURITY=y
CONFIG_INTEGRITY=y
CONFIG_IMA=y
CONFIG_IMA_DEFAULT_HASH_SHA256=y
CONFIG_IMA_WRITE_POLICY=y
